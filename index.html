<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票分析 · 行情看板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--surface3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#d4761f;--purple:#bc8cff;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Roboto,sans-serif;--shadow:0 1px 3px rgba(0,0,0,.3)}
[data-theme="light"]{--bg:#ffffff;--surface:#f6f8fa;--surface2:#eaeef2;--surface3:#dde3e8;--border:#d0d7de;--text:#1f2328;--text2:#57606a;--text3:#8c959f;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--orange:#bd5612;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
html{font-size:15px}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* ===== Layout ===== */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;flex-wrap:wrap}
.topbar .indices{display:flex;gap:16px;flex-wrap:wrap}
.indice{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius);cursor:pointer;transition:background .15s;white-space:nowrap}
.indice:hover{background:var(--surface3)}
.indice .name{color:var(--text2);font-size:12px}
.indice .price{font-weight:600;font-size:14px}
.indice .change{font-size:12px;padding:1px 6px;border-radius:4px;font-weight:500}
.change-up{background:rgba(63,185,80,.15);color:var(--green)}
.change-down{background:rgba(248,81,73,.15);color:var(--red)}
.change-flat{background:rgba(139,148,158,.15);color:var(--text2)}
.stats{display:flex;gap:8px;margin-left:auto;align-items:center;font-size:12px;color:var(--text2)}
.stats span{padding:2px 8px;border-radius:4px;background:var(--surface2)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;transition:all .15s}
.theme-btn:hover{background:var(--surface3);color:var(--text)}
/* ===== Main ===== */
.main{display:grid;grid-template-columns:320px 1fr 300px;gap:1px;flex:1;overflow:hidden;background:var(--border)}
.panel{background:var(--bg);overflow-y:auto;padding:12px}
.panel-header{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
/* ===== Left Panel ===== */
.sector-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:4px;cursor:pointer;transition:background .15s;font-size:14px}
.sector-item:hover{background:var(--surface2)}
.sector-item .name{color:var(--text)}
.sector-item .change{font-weight:500}
.sector-group{margin-bottom:14px}
.news-item{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:color .15s}
.news-item:last-child{border-bottom:none}
.news-item:hover{color:var(--accent)}
.news-item .title{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-item .time{font-size:11px;color:var(--text3);margin-top:2px}
/* ===== Center Panel ===== */
.center-panel{display:flex;flex-direction:column}
.stock-header{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.stock-header .name-code{font-size:20px;font-weight:600}
.stock-header .name-code small{font-weight:400;font-size:13px;color:var(--text2);margin-left:6px}
.stock-header .price-row{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.stock-header .current-price{font-size:32px;font-weight:700}
.stock-header .price-change{font-size:18px;font-weight:500}
.stock-header .extra-info{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.chart-wrap{padding:8px;flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#klineChart{width:100%;flex:1;min-height:320px;cursor:crosshair}
.indicator-bar{display:flex;gap:4px;padding:4px 8px;background:var(--surface2);border-top:1px solid var(--border);flex-shrink:0}
.indicator-bar button{padding:3px 10px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.indicator-bar button:hover{color:var(--text);background:var(--surface3)}
.indicator-bar button.active{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.1)}
.indicator-bar .range-div{color:var(--text3);font-size:11px;margin:0 4px}
/* ===== Right Panel ===== */
.flow-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:4px;font-size:13px;cursor:pointer;transition:background .15s}
.flow-item:hover{background:var(--surface2)}
.flow-item .name{color:var(--text)}
.flow-item .val{font-weight:500}
.watchlist-input{display:flex;gap:6px;margin-bottom:10px}
.watchlist-input input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;outline:none}
.watchlist-input input:focus{border-color:var(--accent)}
.watchlist-input button{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:500}
.watch-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .15s;font-size:13px}
.watch-item:hover{background:var(--surface2)}
.watch-item .name{flex:1}
.watch-item .price{font-weight:600;margin:0 8px}
.watch-item .del{cursor:pointer;color:var(--text3);font-size:16px;line-height:1;padding:0 4px}
.watch-item .del:hover{color:var(--red)}
/* ===== Sector Stocks ===== */
.sector-stocks{font-size:13px}
.sector-stocks .ss-header{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:8px}
.sector-stocks .ss-header .back-btn{cursor:pointer;color:var(--accent);font-size:12px;font-weight:400}
.sector-stocks .ss-header .back-btn:hover{text-decoration:underline}
.sector-stocks .ss-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .15s;font-size:13px}
.sector-stocks .ss-item:hover{background:var(--surface2)}
.sector-stocks .ss-item .name{flex:1}
.sector-stocks .ss-item .price{font-weight:500;margin:0 10px;width:80px;text-align:right}
.sector-stocks .ss-item .change{font-weight:500;width:70px;text-align:right}
/* ===== Search Overlay ===== */
.search-box{width:100%;max-width:500px;margin:0 auto;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:14px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent);background:var(--surface)}
.search-box input::placeholder{color:var(--text3)}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);max-height:320px;overflow-y:auto;z-index:100;display:none;box-shadow:var(--shadow)}
.search-results.show{display:block}
.search-result-item{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);transition:background .15s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--surface3)}
.search-result-item .code{color:var(--text2);font-size:12px}
.search-result-item .name{font-weight:500}
/* ===== Bottom ===== */
.bottom-bar{background:var(--surface);border-top:1px solid var(--border);padding:8px 16px;flex-shrink:0;display:flex;gap:12px;align-items:center}
.bottom-bar .status{font-size:12px;color:var(--text2);white-space:nowrap}
.bottom-bar .search-box{margin:0 12px}
/* ===== Loading ===== */
.loading{color:var(--text3);text-align:center;padding:20px;font-size:13px}
/* ===== Mobile Panel Toggle ===== */
.panel-toggle{display:none;padding:0 4px;font-size:12px;white-space:nowrap}
.panel-toggle button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.panel-toggle button:hover{background:var(--surface3);color:var(--text)}
@media(max-width:768px){
  .panel-toggle{display:flex;gap:6px;padding:6px 8px;background:var(--surface2);border-bottom:1px solid var(--border);overflow-x:auto}
  .main{grid-template-columns:1fr}
  .panel{display:none}
  .panel.mobile-show{display:block}
  .center-panel.panel{display:flex}
  .topbar{padding:6px 8px;gap:6px}
  .topbar .indices{gap:4px}
  .indice{padding:2px 5px;gap:3px}
  .indice .name{font-size:11px}
  .indice .price{font-size:12px}
  .indice .change{font-size:10px;padding:0 3px}
  .stats{font-size:11px;gap:4px}
  .stats span{padding:1px 4px}
  .bottom-bar{flex-wrap:wrap;padding:6px 8px;gap:6px}
  .bottom-bar .search-box{margin:0;flex:1;min-width:120px}
  .bottom-bar > div:first-child{font-size:12px!important}
  .bottom-bar .status{font-size:11px}
  .search-box input{font-size:13px;padding:8px 10px}
  .stock-header{padding:6px 8px}
  .stock-header .name-code{font-size:16px}
  .stock-header .current-price{font-size:24px}
  .stock-header .price-change{font-size:14px}
  .stock-header .extra-info{gap:8px;font-size:11px}
  .indicator-bar{flex-wrap:wrap;gap:2px;padding:4px}
  .indicator-bar button{font-size:11px;padding:2px 6px}
  .indicator-bar span{font-size:10px!important}
  .chart-wrap{padding:4px}
  #klineChart{min-height:220px}
  .sector-item{padding:5px 6px;font-size:13px}
  .news-item{padding:6px 0}
  .news-item .title{font-size:13px}
  .panel{padding:8px}
  .sector-stocks .ss-item{font-size:12px}
  .sector-stocks .ss-header{font-size:13px}
  .flow-item{padding:5px 6px;font-size:12px}
  .watch-item{padding:5px 6px;font-size:12px}
  .watchlist-input input{font-size:12px;padding:5px 8px}
  .watchlist-input button{padding:5px 10px}
  .panel-header{font-size:12px}
  #sectorStocks{max-height:150px}
}
@media(max-width:480px){
  .indice .price{font-size:11px}
  .indice .change{display:none}
  .indice .name{font-size:10px}
  .stock-header .name-code{font-size:14px}
  .stock-header .current-price{font-size:20px}
  .stock-header .price-change{font-size:12px}
  .stock-header .extra-info{font-size:10px;gap:4px}
  #klineChart{min-height:180px}
  .bottom-bar > div:first-child{font-size:11px!important}
  .bottom-bar .status{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="indices" id="indices"></div>
    <div class="stats" id="marketStats"></div>
    <div class="topbar-actions">
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
  </div>

  <!-- Mobile Panel Toggle -->
  <div class="panel-toggle" id="panelToggle">
    <button class="active" onclick="switchMobilePanel('center',this)" title="K线图、技术指标、股票详情">📈 行情</button>
    <button onclick="switchMobilePanel('left',this)" title="热点板块、实时快讯">🔥 板块</button>
    <button onclick="switchMobilePanel('right',this)" title="主力资金流向、自选股列表">💰 资金</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left: Sectors + News -->
    <div class="panel" id="leftPanel">
      <div id="sectorPanel">
        <div class="panel-header">🔥 热点板块 <span style="font-weight:400;text-transform:none;cursor:pointer;font-size:12px" onclick="loadSectors()">↻</span></div>
        <div id="sectorList"><div class="loading">加载中…</div></div>
      </div>
      <div style="margin-top:16px" id="newsPanel">
        <div class="panel-header">📰 快讯 <span style="font-weight:400;text-transform:none;cursor:pointer;font-size:12px" onclick="loadNews()">↻</span></div>
        <div id="newsList"><div class="loading">加载中…</div></div>
      </div>
    </div>

    <!-- Center: Stock Detail + Chart -->
    <div class="center-panel panel">
      <div id="sectorStocks" style="display:none;padding:8px 12px;max-height:200px;overflow-y:auto;border-bottom:1px solid var(--border)"></div>
      <div class="stock-header" id="stockHeader">
        <div class="loading">点击板块或搜索股票查看详情</div>
      </div>
      <div class="indicator-bar" id="indicatorBar">
        <button class="active" data-ind="none" onclick="switchIndicator('none',this)" title="纯K线 + 成交量柱，无指标叠加">K线</button>
        <button data-ind="ma" onclick="switchIndicator('ma',this)" title="移动平均线：MA5(白)、MA10(黄)、MA20(紫) 趋势跟踪">MA</button>
        <button data-ind="macd" onclick="switchIndicator('macd',this)" title="MACD(12,26,9)：DIF(白)-DEA(黄)-红绿柱 趋势+买卖信号">MACD</button>
        <button data-ind="rsi" onclick="switchIndicator('rsi',this)" title="RSI(6,12,24)：超买>70 超卖<30 判断强弱">RSI</button>
        <button data-ind="kdj" onclick="switchIndicator('kdj',this)" title="KDJ(9,3,3)：K(红)-D(黄)-J(蓝) 短线超买超卖">KDJ</button>
        <button data-ind="boll" onclick="switchIndicator('boll',this)" title="布林带(20,2)：UP(白)-MID(黄)-DN(紫) 压力位/支撑位">BOLL</button>
        <span style="margin-left:8px;font-size:11px;color:var(--text3)">|</span>
        <button class="active" data-range="30" onclick="switchRange(30,this)" title="近1个月（30个交易日）">1月</button>
        <button data-range="90" onclick="switchRange(90,this)" title="近3个月（90个交易日）">3月</button>
        <button data-range="180" onclick="switchRange(180,this)" title="近6个月（180个交易日）">6月</button>
        <button data-range="365" onclick="switchRange(365,this)" title="近1年（365个交易日）">1年</button>
        <span style="margin-left:auto;font-size:11px;color:var(--text3)" id="indicatorDesc">纯K线 + 成交量</span>
      </div>
      <div class="chart-wrap">
        <canvas id="klineChart"></canvas>
      <div id="chartTooltip" style="position:absolute;display:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.6;pointer-events:none;z-index:50;box-shadow:var(--shadow);min-width:140px"></div>
      </div>
    </div>

    <!-- Right: Money Flow + Watchlist -->
    <div class="panel" id="rightPanel">
      <div id="flowPanel">
        <div class="panel-header">💰 主力资金 <span style="font-weight:400;text-transform:none;cursor:pointer;font-size:12px" onclick="loadMoneyFlow()">↻</span></div>
        <div id="flowList"><div class="loading">加载中…</div></div>
      </div>
      <div style="margin-top:16px" id="watchPanel">
        <div class="panel-header">⭐ 自选</div>
        <div class="watchlist-input">
          <input id="watchInput" placeholder="输入代码，如 600519" onkeydown="if(event.key==='Enter')addWatch()">
          <button onclick="addWatch()">+</button>
        </div>
        <div id="watchList"><div class="loading">暂无自选，输入代码添加</div></div>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div style="font-size:13px;color:var(--text2);white-space:nowrap">❤️ 为爱发电！</div>
    <div class="search-box">
      <input id="searchInput" placeholder="搜索股票名称 / 代码 (如 茅台 / 600519 / MAOTAI)">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="status" id="statusBar">就绪</div>
    <button onclick="showDonate()" style="background:var(--red);color:#fff;border:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap">☕ 捐赠</button>
  </div>
  <!-- Donate Modal -->
  <div id="donateModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeDonate()">
    <div style="background:var(--surface);border-radius:12px;padding:28px;text-align:center;max-width:420px;box-shadow:var(--shadow)">
      <div style="font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text)">感谢支持 ❤️</div>

<script>
// ===== Utilities =====
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmt = n => {if(n==null||isNaN(n))return'--';const v=Number(n);return v>=10000?((v/10000).toFixed(2)+'万'):v>=1e8?((v/1e8).toFixed(2)+'亿'):v.toFixed(2)};
const fmtLarge = n => {if(n==null||isNaN(n))return'--';const v=Math.abs(Number(n));let s=v>=1e8?(v/1e8).toFixed(2)+'亿':v>=1e4?(v/1e4).toFixed(2)+'万':v.toFixed(0);return Number(n)<0?'-'+s:s};
const pct = n => n==null?'--':(n>0?'+':'')+Number(n).toFixed(2)+'%';
const cls = n => n==null?'change-flat':n>0?'change-up':n<0?'change-down':'change-flat';

// ===== 手机面板切换 =====
function switchMobilePanel(name,btn){
  $$('#panelToggle button').forEach(b=>b.classList.remove('active'));

  ['leftPanel','rightPanel'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.classList.toggle('mobile-show',id===name+'Panel');
  });
}

function toggleTheme(){
  const d=document.documentElement;

}

// ===== Tencent Finance API (GB2312→UTF-8) =====
async function fetchQuotes(codes){
  if(!codes.length)return{};
  const q=codes.join(',').replace(/^sh/,'sh').replace(/^sz/,'sz');
  try{
    const r=await fetch(`https://qt.gtimg.cn/q=${q}`,{headers:{'Referer':'https://qt.gtimg.cn'}});
    const buf=await r.arrayBuffer();
    const t=new TextDecoder('gbk').decode(buf);
    const o={};
    t.split(';').filter(l=>l.includes('="')).forEach(l=>{
      try{
        const m=l.match(/v_(\w+)="(.+)"/);
        if(!m)return;
        const f=m[2].split('~');
        const _p=parseFloat(f[3]),_yc=parseFloat(f[4]);
        const _chgPctRaw=parseFloat(f[32]);
        const _isIdx=Math.abs(_chgPctRaw)>=100; // f[32]是时间戳→指数
        const _chgPct=_isIdx?(parseFloat(f[34])||((_p-_yc)/_yc*100)):_chgPctRaw;
        // 指数比股票字段偏移+2（因股票有f[31]涨跌额+f[32]涨跌幅，指数f[31]空+f[32]时间戳）
        const _off=_isIdx?2:0;
        o[m[1]]={
          name:f[1],code:f[2],price:_p,yclose:_yc,open:parseFloat(f[5]),
          volume:parseFloat(f[6]),
          high:parseFloat(f[33+_off])||0,low:parseFloat(f[34+_off])||0,
          chgPct:_chgPct,
          chgAmt:parseFloat(f[31])||parseFloat(f[33])||(_p-_yc),
          amount:(parseFloat(f[37+_off])||0)*10000, // 万元→元
          turnover:0 // 指数无换手率
        };
      }catch(e){}
    });
    return o;
  }catch(e){return{}}
}

let allStocksCache=null;

async function loadAllStocks(){
  if(allStocksCache)return allStocksCache;
  if(stocksPromise)return stocksPromise;
  const base='https://push2.eastmoney.com/api/qt/clist/get?po=0&np=1&fields=f12,f14&fid=f12&fs=m:0+t:6+f:!2,m:0+t:80+f:!2';

      if(!total)return[];
      const ps=100,pages=Math.ceil(total/ps),reqs=[];

function calcMA(data,n){return data.map((_,i)=>{if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].close;return s/n})}
function calcEMA(data,n){const r=[data[0].close];for(let i=1;i<data.length;i++)r.push(data[i].close*(2/(n+1))+r[i-1]*(1-2/(n+1)));return r}
function calcMACD(data){const e12=calcEMA(data,12),e26=calcEMA(data,26),dif=e12.map((v,i)=>v-e26[i]);const dea=calcEMA(dif.map(v=>({close:v})),9);return dif.map((v,i)=>(v-dea[i])*2).slice(33),{dif,dea,macd:dif.map((v,i)=>2*(v-dea[i]))}}
function calcRSI(data,n){const r=[];for(let i=0;i<data.length;i++){if(i<n){r.push(null);continue}let g=0,loss=0;for(let j=i-n+1;j<=i;j++){const d=data[j].close-data[j-1].close;if(d>0)g+=d;else loss-=d}const avgG=g/n,avgL=loss/n;r.push(avgL===0?100:100-100/(1+avgG/avgL))}return r}
function calcKDJ(data){const r=[];const n=9;for(let i=0;i<data.length;i++){if(i<n-1){r.push({k:null,d:null,j:null});continue}let h=-Infinity,l=Infinity;for(let j=i-n+1;j<=i;j++){h=Math.max(h,parseFloat(data[j].high));l=Math.min(l,parseFloat(data[j].low))}const rsv=(data[i].close-l)/(h-l)*100;const pk=i===n-1?50:r[i-1].k;const pd=i===n-1?50:r[i-1].d;const k=pk*2/3+rsv/3;const d=pd*2/3+k/3;r.push({k,d,j:3*k-2*d})}return r}
function calcBOLL(data,n=20,m=2){const r=[];for(let i=0;i<data.length;i++){if(i<n-1){r.push({mid:null,up:null,dn:null});continue}let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].close;const ma=s/n;let sq=0;for(let j=i-n+1;j<=i;j++)sq+=Math.pow(data[j].close-ma,2);const std=Math.sqrt(sq/n);r.push({mid:ma,up:ma+m*std,dn:ma-m*std})}return r}

// ===== 绘制图表 =====
function drawChart(){
  const canvas=$('#klineChart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  const cssW=rect.width-16||canvas.parentElement.clientWidth||800;
  const padding={top:30,bottom:40,left:50,right:20};
  
  if(!klineData||klineData.length<2){
    canvas.width=cssW*dpr;canvas.height=200*dpr;canvas.style.width=cssW+'px';canvas.style.height='200px';
    ctx.scale(dpr,dpr);
    ctx.fillStyle='#8b949e';ctx.font='14px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';
    ctx.textAlign='center';ctx.fillText('暂无K线数据',cssW/2,100);
    return;
  }

  const chartAreaH=Math.max(200,canvas.parentElement.clientHeight-80);
  const H=chartAreaH+padding.top+padding.bottom;
  const W=cssW;
  canvas.width=cssW*dpr;
  canvas.height=H*dpr;
  canvas.style.width=cssW+'px';
  canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  
  const ch=chartAreaH;
  const data=klineData;
  const allHigh=data.map(d=>d.high);
  const allLow=data.map(d=>d.low);
  const maxPrice=Math.max(...allHigh);
  const minPrice=Math.min(...allLow);
  const range=maxPrice-minPrice||1;
  const barW=Math.max(3,Math.min(12,(W-padding.left-padding.right-10)/data.length));
  const gap=2;
  const step=barW+gap;

  const x=i=>padding.left+i*step;
  const y=p=>padding.top+ch-(p-minPrice)/range*ch;

  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const text=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const text2=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
  const surface2=getComputedStyle(document.documentElement).getPropertyValue('--surface2').trim();
  const green=getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
  const red=getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

  ctx.clearRect(0,0,W,H);
  
  // Grid
  ctx.strokeStyle=surface2;ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const yy=padding.top+ch/4*i;
    ctx.beginPath();ctx.moveTo(padding.left,yy);ctx.lineTo(W-padding.right,yy);ctx.stroke();
    ctx.fillStyle=text2;ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='right';
    ctx.fillText((maxPrice-(maxPrice-minPrice)/4*i).toFixed(2),padding.left-4,yy+4);
  }

  // K-line
  data.forEach((d,i)=>{
    const xi=x(i);
    const isUp=d.close>=d.open;
    const c=isUp?red:green; // 中国习惯：红涨绿跌
    const o=y(d.open),cl=y(d.close),h=y(d.high),l=y(d.low);
    // High-low line
    ctx.strokeStyle=c;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(xi,h);ctx.lineTo(xi,l);ctx.stroke();
    // Body
    const bodyTop=Math.min(o,cl),bodyBot=Math.max(o,cl);
    const bw=Math.max(2,barW-2);
    if(bodyBot-bodyTop<1){ctx.fillStyle=c;ctx.fillRect(xi-bw/2,bodyTop-1,bw,2)}
    else{ctx.fillStyle=c;ctx.fillRect(xi-bw/2,bodyTop,bw,Math.max(1,bodyBot-bodyTop))}
  });

  // Volume
  const maxVol=Math.max(...data.map(d=>d.vol),1);
  data.forEach((d,i)=>{
    const xi=x(i);
    const c=d.close>=d.open?red:green; // 红涨绿跌
    const vh=d.vol/maxVol*(ch/5);
    ctx.fillStyle=c;ctx.globalAlpha=.3;
    ctx.fillRect(xi-barW/2+1,H-padding.bottom-vh,Math.max(1,barW-2),vh);
    ctx.globalAlpha=1;
  });

  // MA lines
  if(indicator==='ma'){
    const colors=['#58a6ff','#d29922','#bc8cff'];
    [5,10,20].forEach((n,idx)=>{
      const ma=calcMA(data,n);
      ctx.strokeStyle=colors[idx];ctx.lineWidth=1.2;
      ctx.beginPath();let started=false;
      ma.forEach((v,i)=>{if(v!==null){if(!started){ctx.moveTo(x(i),y(v));started=true}else ctx.lineTo(x(i),y(v))}});
      ctx.stroke();
      // Legend
      const lx=W-padding.right-10-(2-idx)*50;
      ctx.fillStyle=colors[idx];ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='left';
      ctx.fillText(`MA${n}`,lx,padding.top-8);
    });
  }
  // MACD
  else if(indicator==='macd'&&data.length>33){
    const macd=calcMACD(data);
    const dif=macd.dif.slice(33),dea=macd.dea.slice(33),macdV=macd.macd.slice(33);
    const startIdx=33;
    const mMax=Math.max(...macdV.map(Math.abs),0.1);
    const mh=ch/3;
    const my=v=>padding.top+ch-mh/2-v/mMax*mh/2;
    
    ctx.strokeStyle=accent;ctx.lineWidth=1.2;
    ctx.beginPath();let started=false;
    dif.forEach((v,i)=>{if(!started){ctx.moveTo(x(i+startIdx),my(v));started=true}else ctx.lineTo(x(i+startIdx),my(v))});
    ctx.stroke();
    
    ctx.strokeStyle='#d29922';ctx.lineWidth=1.2;
    ctx.beginPath();started=false;
    dea.forEach((v,i)=>{if(!started){ctx.moveTo(x(i+startIdx),my(v));started=true}else ctx.lineTo(x(i+startIdx),my(v))});
    ctx.stroke();

    macdV.forEach((v,i)=>{
      const xi=x(i+startIdx),yi=my(0);
      ctx.fillStyle=v>0?green:red;
      ctx.fillRect(xi-barW/2+1,Math.min(yi,my(v)),Math.max(1,barW-2),Math.max(1,Math.abs(my(v)-yi)));
    });

    ctx.fillStyle=accent;ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='left';
    ctx.fillText('DIF',W-padding.right-10,padding.top-4);
    ctx.fillStyle='#d29922';
    ctx.fillText('DEA',W-padding.right-50,padding.top-4);
  }
  // RSI
  else if(indicator==='rsi'&&data.length>24){
    const rsi6=calcRSI(data,6),rsi12=calcRSI(data,12),rsi24=calcRSI(data,24);
    const mh=ch/3;
    const my=v=>padding.top+ch-mh/2-(v-50)/50*mh/2;
    
    ctx.strokeStyle='#f85149';ctx.lineWidth=1.2;
    ctx.beginPath();let started=false;
    rsi6.forEach((v,i)=>{if(v!==null){if(!started){ctx.moveTo(x(i),my(v));started=true}else ctx.lineTo(x(i),my(v))}});
    ctx.stroke();

    ctx.strokeStyle='#d29922';ctx.lineWidth=1.2;
    ctx.beginPath();started=false;
    rsi12.forEach((v,i)=>{if(v!==null){if(!started){ctx.moveTo(x(i),my(v));started=true}else ctx.lineTo(x(i),my(v))}});
    ctx.stroke();

    ctx.strokeStyle=accent;ctx.lineWidth=1.2;
    ctx.beginPath();started=false;
    rsi24.forEach((v,i)=>{if(v!==null){if(!started){ctx.moveTo(x(i),my(v));started=true}else ctx.lineTo(x(i),my(v))}});
    ctx.stroke();

    // Oversold/overbought lines
    ctx.strokeStyle=text2;ctx.setLineDash([3,3]);ctx.lineWidth=.5;
    [30,70].forEach(v=>{const yy=my(v);ctx.beginPath();ctx.moveTo(padding.left,yy);ctx.lineTo(W-padding.right,yy);ctx.stroke()});
    ctx.setLineDash([]);

    ctx.fillStyle='#f85149';ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='left';
    ctx.fillText('RSI6',W-padding.right-10,padding.top-4);
    ctx.fillStyle='#d29922';
    ctx.fillText('RSI12',W-padding.right-50,padding.top-4);
    ctx.fillStyle=accent;
    ctx.fillText('RSI24',W-padding.right-90,padding.top-4);
  }
  // KDJ
  else if(indicator==='kdj'&&data.length>9){
    const kdj=calcKDJ(data);
    const mh=ch/3;
    const my=v=>padding.top+ch-mh/2-(v-50)/50*mh/2;
    
    ctx.strokeStyle='#f85149';ctx.lineWidth=1.2;
    ctx.beginPath();let started=false;
    kdj.forEach((d,i)=>{if(d.k!==null){if(!started){ctx.moveTo(x(i),my(d.k));started=true}else ctx.lineTo(x(i),my(d.k))}});
    ctx.stroke();

    ctx.strokeStyle='#d29922';ctx.lineWidth=1.2;
    ctx.beginPath();started=false;
    kdj.forEach((d,i)=>{if(d.d!==null){if(!started){ctx.moveTo(x(i),my(d.d));started=true}else ctx.lineTo(x(i),my(d.d))}});
    ctx.stroke();

    ctx.strokeStyle=accent;ctx.lineWidth=1.2;
    ctx.beginPath();started=false;
    kdj.forEach((d,i)=>{if(d.j!==null){if(!started){ctx.moveTo(x(i),my(d.j));started=true}else ctx.lineTo(x(i),my(d.j))}});
    ctx.stroke();

    ctx.fillStyle='#f85149';ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='left';
    ctx.fillText('K',W-padding.right-10,padding.top-4);
    ctx.fillStyle='#d29922';
    ctx.fillText('D',W-padding.right-35,padding.top-4);
    ctx.fillStyle=accent;
    ctx.fillText('J',W-padding.right-60,padding.top-4);
  }
  // BOLL
  else if(indicator==='boll'&&data.length>19){
    const boll=calcBOLL(data);
    const colors=['#58a6ff','#d29922','#bc8cff'];
    ['up','mid','dn'].forEach((key,idx)=>{
      ctx.strokeStyle=colors[idx];ctx.lineWidth=1;
      ctx.beginPath();let started=false;
      boll.forEach((d,i)=>{if(d[key]!==null){if(!started){ctx.moveTo(x(i),y(d[key]));started=true}else ctx.lineTo(x(i),y(d[key]))}});
      ctx.stroke();
    });
    ctx.fillStyle='#58a6ff';ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='left';
    ctx.fillText('UP',W-padding.right-10,padding.top-4);
    ctx.fillStyle='#d29922';
    ctx.fillText('MID',W-padding.right-40,padding.top-4);
    ctx.fillStyle='#bc8cff';
    ctx.fillText('DN',W-padding.right-75,padding.top-4);
  }

  // Date labels — 只显示首尾日期，鼠标悬停看具体日期
  ctx.fillStyle=text2;ctx.font='11px -apple-system,"Segoe UI","Noto Sans SC",sans-serif';ctx.textAlign='center';
  const firstDate=data[0].date,lastDate=data[data.length-1].date;
  const fmtD=d=>d.length>=10?d.substring(5,10):d.substring(2);
  ctx.fillText(fmtD(firstDate),x(0),H-padding.bottom+16);
  ctx.fillText(fmtD(lastDate),x(data.length-1),H-padding.bottom+16);

  // Crosshair & tooltip state (drawn by mousemove)
  if(window._hoverIdx>=0){
    const idx=window._hoverIdx;
    if(idx>=0&&idx<data.length){
      const d=data[idx];
      const xi=x(idx);
      // Vertical crosshair
      ctx.strokeStyle='rgba(139,148,158,.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(xi,padding.top);ctx.lineTo(xi,H-padding.bottom);ctx.stroke();
      ctx.setLineDash([]);
      // Horizontal crosshair
      if(window._hoverY){
        ctx.strokeStyle='rgba(139,148,158,.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(padding.left,window._hoverY);ctx.lineTo(W-padding.right,window._hoverY);ctx.stroke();
        ctx.setLineDash([]);
      }
      // Highlight candle
      ctx.strokeStyle='rgba(88,166,255,.6)';ctx.lineWidth=1.5;
      ctx.strokeRect(xi-barW/2-2,padding.top-2,barW+4,ch+4);
    }
  }
}

// ===== Chart mouse interaction =====
(function(){
  const canvas=$('#klineChart');
  const tooltip=$('#chartTooltip');
  canvas.addEventListener('mousemove',function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const W=canvas.clientWidth;
    const padding={top:30,bottom:40,left:50,right:20};
    const data=klineData;
    if(!data||data.length<2){tooltip.style.display='none';return}
    const barW=Math.max(3,Math.min(12,(W-padding.left-padding.right-10)/data.length));
    const gap=2;
    const step=barW+gap;
    const idx=Math.round((mx-padding.left)/step);
    if(idx<0||idx>=data.length){tooltip.style.display='none';window._hoverIdx=-1;drawChart();return}
    window._hoverIdx=idx;
    window._hoverY=my;
    drawChart();
    // Position tooltip
    const d=data[idx];
    const chg=d.close-d.open;
    const chgPct=d.open?((d.close-d.open)/d.open*100):0;
    const chgCls=chg>=0?'var(--green)':'var(--red)';
    tooltip.innerHTML=`
      <div style="font-weight:600;margin-bottom:4px">${d.date}</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2px 12px">
        <span style="color:var(--text2)">开盘</span><span style="text-align:right;font-weight:500">${d.open.toFixed(2)}</span>
        <span style="color:var(--text2)">收盘</span><span style="text-align:right;font-weight:500;color:${chgCls}">${d.close.toFixed(2)}</span>
        <span style="color:var(--text2)">最高</span><span style="text-align:right;font-weight:500;color:var(--red)">${d.high.toFixed(2)}</span>
        <span style="color:var(--text2)">最低</span><span style="text-align:right;font-weight:500;color:var(--green)">${d.low.toFixed(2)}</span>
        <span style="color:var(--text2)">涨跌</span><span style="text-align:right;font-weight:500;color:${chgCls}">${chg>=0?'+':''}${chg.toFixed(2)} (${chgPct>=0?'+':''}${chgPct.toFixed(2)}%)</span>
        <span style="color:var(--text2)">成交量</span><span style="text-align:right;font-weight:500">${fmt(d.vol)}</span>
      </div>
    `;
    // Place tooltip - avoid going off-screen
    const tw=tooltip.offsetWidth||160;
    const th=tooltip.offsetHeight||120;
    const canvasRect=canvas.closest('.chart-wrap').getBoundingClientRect();
    let tx=e.clientX-canvasRect.left+12;
    let ty=e.clientY-canvasRect.top-10-th;
    if(tx+tw>canvasRect.width-10)tx=e.clientX-canvasRect.left-tw-12;
    if(ty<10)ty=e.clientY-canvasRect.top+20;
    tooltip.style.left=tx+'px';
    tooltip.style.top=ty+'px';
    tooltip.style.display='block';
  });
  canvas.addEventListener('mouseleave',function(){
    tooltip.style.display='none';
    window._hoverIdx=-1;
    drawChart();
  });
})();

// ===== 鼠标滚轮缩放 =====
(function(){
  const canvas=$('#klineChart');
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    const ranges=[15,30,60,90,180,365,730];
    let idx=ranges.indexOf(klineRange);
    if(idx<0){idx=1;klineRange=30}
    if(e.deltaY<0&&idx<ranges.length-1)idx++;
    else if(e.deltaY>0&&idx>0)idx--;
    const newRange=ranges[idx];
    if(newRange!==klineRange){
      klineRange=newRange;
      $$('#indicatorBar button[data-range]').forEach(b=>{
        b.classList.toggle('active',parseInt(b.dataset.range)===klineRange);
      });
      loadKline();
    }
  },{passive:false});
})();

// ===== Auto resize =====
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(drawChart,200);
});

// ===== Refresh all =====
async function refreshAll(){
  $('#statusBar').textContent='🔄 刷新中…';
  await Promise.all([loadIndices(),loadMarketStats(),loadWatchlist()]);
  await Promise.all([loadSectors(),loadMoneyFlow(),loadNews()]);
  if(currentStock) await Promise.all([loadStockDetail(),loadKline()]);
  $('#statusBar').textContent=`✅ ${new Date().toLocaleTimeString('zh-CN')}`;
}

// ===== Init =====
(async function init(){
  const savedTheme=localStorage.getItem('theme');
  if(savedTheme)document.documentElement.dataset.theme=savedTheme;
  
  await refreshAll();
  await selectStock('sh600519','贵州茅台','sh','1.600519');
  
  refreshTimer=setInterval(refreshAll,15000);
})();
</script>
